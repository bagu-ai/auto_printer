name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 单元测试
        run: pytest -q
      - name: 离屏全流程冒烟
        run: python tools/smoke_mock.py
